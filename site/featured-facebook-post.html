<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="indexifembedded">
<title>Featured Post</title>
<meta name="description" content="Current featured public post inside the Sol-37 desktop shell.">
<style>
  :root {
    color-scheme: light;
    --paper: #f4f1e8;
    --ink: #141414;
    --line: #7c7c7c;
    --shadow: rgba(0, 0, 0, 0.22);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "MS Sans Serif", "Segoe UI", Tahoma, sans-serif;
  }

  body {
    display: grid;
    place-items: start center;
    padding: 18px;
  }

  main {
    width: min(540px, 100%);
  }

  .embed-frame {
    width: 100%;
    padding: 12px;
    border: 2px solid #fff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    background: #c0c0c0;
    box-shadow: 0 18px 42px var(--shadow);
  }

  iframe {
    display: block;
    width: 500px;
    max-width: 100%;
    height: 527px;
    border: 0;
    overflow: hidden;
    background: #fff;
  }
</style>
</head>
<body>
  <main aria-label="Featured Facebook post">
    <div class="embed-frame">
      <!-- featured-facebook-iframe:start -->
      <iframe src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fdavidlones365%2Fposts%2Fpfbid0YArdqQFUfNZp71bAwZGr8HtvuLuGJ6Q3iPkN82tTwm6aFSGgsgPwxiH8Z9CjEpQzl&amp;show_text=true&amp;width=500" width="500" height="527" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
      <!-- featured-facebook-iframe:end -->
    </div>
  </main>
</body>
</html>
